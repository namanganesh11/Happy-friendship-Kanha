<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day Swiggy ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CONTAINER STYLING */
    .container {
      position: relative;
      z-index: 10;
      width: 95%;
      max-width: 950px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 30px 15px;
      border-radius: 24px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1: FRONT QUESTION SCREEN */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 70px;
    }

    /* BUTTON ZONE */
    .button-zone {
      position: relative;
      width: 100%;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    /* CONSTANTLY MOVING NO BUTTON */
    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      will-change: left, top;
    }

    /* PAGE 2 LAYOUT */
    #page2 {
      display: none;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 25px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* 2-PHOTO WRAPPER LAYOUT */
    .wish-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin: 20px auto;
    }

    /* WISH TEXT */
    .center-wish {
      font-size: 2.2rem;
      color: #f472b6;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      line-height: 1.25;
    }

    .photos-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    /* PHOTO SLOTS */
    .photo-slot {
      width: 170px;
      height: 170px;
      background: rgba(30, 20, 40, 0.9);
      border-radius: 50%;
      padding: 8px;
      border: 2px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* PLUS ICON STYLING */
    .plus-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.15);
      border: 2px dashed #f472b6;
      color: #f472b6;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .plus-btn:hover {
      transform: scale(1.15);
      background: rgba(244, 114, 182, 0.35);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
    }

    /* DISPLAYED LOCKED IMAGE */
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    input[type="file"] {
      display: none;
    }

    /* RESPONSIVE SCALING FOR MOBILE SCREENS */
    @media (max-width: 620px) {
      .center-wish {
        font-size: 1.6rem;
      }
      .photos-row {
        gap: 20px;
      }
      .photo-slot {
        width: 130px;
        height: 130px;
      }
      .plus-btn {
        width: 45px;
        height: 45px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- PINK DIGITAL RAIN CANVAS -->
  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friend forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <!-- Friendship Quote -->
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <div class="wish-container">
        <!-- Wish Text -->
        <div class="center-wish">
          Happy Friendship Day, Swiggy! 💖
        </div>

        <!-- 2 PHOTOS ROW -->
        <div class="photos-row">
          <!-- Slot 0 -->
          <div class="photo-slot" id="slot-0">
            <div class="plus-btn" onclick="triggerUpload(0)">+</div>
            <input type="file" id="input-0" accept="image/*" onchange="uploadSinglePhoto(event, 0)" />
          </div>

          <!-- Slot 1 -->
          <div class="photo-slot" id="slot-1">
            <div class="plus-btn" onclick="triggerUpload(1)">+</div>
            <input type="file" id="input-1" accept="image/*" onchange="uploadSinglePhoto(event, 1)" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* 2. CONSTANTLY MOVING & BOUNCING NO BUTTON */
    const noBtn = document.getElementById('noBtn');
    const btnZone = document.getElementById('btnZone');

    // Position & Velocity parameters
    let posX = 20;
    let posY = 20;
    let velX = 2.5; // Horizontal speed
    let velY = 1.8; // Vertical speed

    function animateNoButton() {
      const zoneRect = btnZone.getBoundingClientRect();
      const btnWidth = noBtn.offsetWidth || 100;
      const btnHeight = noBtn.offsetHeight || 50;

      const maxX = zoneRect.width - btnWidth;
      const maxY = zoneRect.height - btnHeight;

      // Update positions
      posX += velX;
      posY += velY;

      // Bounce off boundaries of button-zone
      if (posX <= 0 || posX >= maxX) {
        velX *= -1;
        posX = Math.max(0, Math.min(posX, maxX));
      }

      if (posY <= 0 || posY >= maxY) {
        velY *= -1;
        posY = Math.max(0, Math.min(posY, maxY));
      }

      noBtn.style.left = `${posX}px`;
      noBtn.style.top = `${posY}px`;

      requestAnimationFrame(animateNoButton);
    }
    
    // Start continuous loop
    requestAnimationFrame(animateNoButton);

    // Extra flight boost if cursor/finger comes close
    function fleeIfClose(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const btnRect = noBtn.getBoundingClientRect();
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;

      const dist = Math.hypot(clientX - btnCenterX, clientY - btnCenterY);

      if (dist < 90) {
        // Reverse direction and accelerate away!
        velX = (clientX > btnCenterX ? -1 : 1) * (3.5 + Math.random() * 2);
        velY = (clientY > btnCenterY ? -1 : 1) * (3.5 + Math.random() * 2);
      }
    }

    window.addEventListener('mousemove', fleeIfClose);
    window.addEventListener('touchmove', fleeIfClose);

    /* 3. SWITCH TO PAGE 2 & CONFETTI */
    function goToPage2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });

      renderLockedPhotos();
    }

    /* 4. PERMANENT IMAGE UPLOADER & LOCK SYSTEM */
    function triggerUpload(index) {
      let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_photos') || '{}');
      if (lockedPhotos[index]) return; // Slot already locked
      document.getElementById(`input-${index}`).click();
    }

    function uploadSinglePhoto(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_photos') || '{}');
        
        // Save image permanently to specific circular slot
        lockedPhotos[index] = {
          imgSrc: e.target.result
        };

        localStorage.setItem('swiggy_photos', JSON.stringify(lockedPhotos));
        renderLockedPhotos();
      };

      reader.readAsDataURL(file);
    }

    function renderLockedPhotos() {
      let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_photos') || '{}');

      for (let i = 0; i < 2; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        if (lockedPhotos[i]) {
          // Replace plus button with locked circular image
          slotEl.innerHTML = `<img src="${lockedPhotos[i].imgSrc}" alt="Memory with Swiggy" />`;
          slotEl.style.cursor = "default";
        }
      }
    }
  </script>
</body>
</html>
