<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day Kanha, Radha, Balaram ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CONTAINER STYLING */
    .container {
      position: relative;
      z-index: 10;
      width: 95%;
      max-width: 950px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 30px 15px;
      border-radius: 24px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1: FRONT QUESTION SCREEN */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 50px;
    }

    /* BUTTON ZONE */
    .button-zone {
      position: relative;
      width: 100%;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    #yesBtn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }

    /* PAGE 2 LAYOUT */
    #page2 {
      display: none;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 15px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* CIRCULAR CONTAINER AROUND THE WISH */
    .circle-wrapper {
      position: relative;
      width: 580px;
      height: 580px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CENTER WISH TEXT */
    .center-wish {
      width: 270px;
      font-size: 1.8rem;
      color: #f472b6;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      z-index: 2;
      line-height: 1.25;
    }

    /* PHOTO SLOTS POSITIONED IN A CIRCLE */
    .photo-slot {
      position: absolute;
      width: 140px;
      height: 140px;
      background: rgba(30, 20, 40, 0.9);
      border-radius: 50%;
      padding: 8px;
      border: 2px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 5 Slots Circular Coordinates */
    .slot-0 { top: 0px; left: 50%; transform: translateX(-50%); }
    .slot-1 { top: 155px; right: 10px; }
    .slot-2 { bottom: 50px; right: 80px; }
    .slot-3 { bottom: 50px; left: 80px; }
    .slot-4 { top: 155px; left: 10px; }

    /* DISPLAYED LOCKED IMAGE */
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      cursor: pointer;
    }

    .photo-slot:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.8);
    }
    .slot-0:hover { transform: translateX(-50%) scale(1.1); }

    /* LIGHTBOX MODAL FOR ENLARGING IMAGES */
    #lightboxModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 2, 10, 0.88);
      backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      cursor: pointer;
      animation: fadeIn 0.3s ease;
    }

    #lightboxModal img {
      max-width: 85vw;
      max-height: 80vh;
      border-radius: 16px;
      border: 3px solid #f472b6;
      box-shadow: 0 0 40px rgba(244, 114, 182, 0.6);
      object-fit: contain;
    }

    #lightboxModal .close-hint {
      margin-top: 15px;
      color: #fbcfe8;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* RESPONSIVE SCALING FOR MOBILE SCREENS */
    @media (max-width: 620px) {
      .circle-wrapper {
        width: 340px;
        height: 340px;
      }
      .center-wish {
        width: 160px;
        font-size: 1.2rem;
      }
      .photo-slot {
        width: 85px;
        height: 85px;
      }
      .slot-0 { top: 0px; }
      .slot-1 { top: 90px; right: -5px; }
      .slot-2 { bottom: 25px; right: 35px; }
      .slot-3 { bottom: 25px; left: 35px; }
      .slot-4 { top: 90px; left: -5px; }
      .button-zone {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- PINK DIGITAL RAIN CANVAS -->
  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friend forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <!-- Friendship Quote -->
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <!-- 5 PHOTOS CIRCLE WRAPPER AROUND WISH -->
      <div class="circle-wrapper">
        
        <!-- Center Wish -->
        <div class="center-wish">
          Happy Friendship Day,<br>Kanha, Radha, Balaram! 💖
        </div>

        <!-- Slot 0 (Top Center) -->
        <div class="photo-slot slot-0">
          <img src="https://i.ibb.co/fYbW4pmC/image.jpg" alt="Kanha, Radha, Balaram" onclick="openLightbox(this.src)" />
        </div>

        <!-- Slot 1 (Top Right) -->
        <div class="photo-slot slot-1">
          <img src="https://i.ibb.co/Kzrmmp4m/image.jpg" alt="Kanha, Radha, Balaram" onclick="openLightbox(this.src)" />
        </div>

        <!-- Slot 2 (Bottom Right) -->
        <div class="photo-slot slot-2">
          <img src="https://i.ibb.co/gZpdPdJ7/image.jpg" alt="Kanha, Radha, Balaram" onclick="openLightbox(this.src)" />
        </div>

        <!-- Slot 3 (Bottom Left) -->
        <div class="photo-slot slot-3">
          <img src="https://i.ibb.co/s9159p0y/image.jpg" alt="Kanha, Radha, Balaram" onclick="openLightbox(this.src)" />
        </div>

        <!-- Slot 4 (Top Left) -->
        <div class="photo-slot slot-4">
          <img src="https://i.ibb.co/nTvbD3W/image.jpg" alt="Kanha, Radha, Balaram" onclick="openLightbox(this.src)" />
        </div>

      </div>
    </div>
  </div>

  <!-- FULLSCREEN LIGHTBOX MODAL -->
  <div id="lightboxModal" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Enlarged Memory" />
    <div class="close-hint">Click anywhere to close ✨</div>
  </div>

  <script>
    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* 2. CONTINUOUSLY ORBITING 'NO' BUTTON MECHANIC */
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const btnZone = document.getElementById('btnZone');

    let angle = 0;
    const orbitSpeed = 0.035;
    const orbitRadius = 120;
    let animationFrameId;

    function animateOrbit() {
      angle += orbitSpeed;

      const yesRect = yesBtn.getBoundingClientRect();
      const zoneRect = btnZone.getBoundingClientRect();

      const yesCenterX = (yesRect.left + yesRect.width / 2) - zoneRect.left;
      const yesCenterY = (yesRect.top + yesRect.height / 2) - zoneRect.top;

      const noWidth = noBtn.offsetWidth || 100;
      const noHeight = noBtn.offsetHeight || 50;

      const x = yesCenterX + orbitRadius * Math.cos(angle) - (noWidth / 2);
      const y = yesCenterY + orbitRadius * Math.sin(angle) - (noHeight / 2);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      animationFrameId = requestAnimationFrame(animateOrbit);
    }

    animateOrbit();

    function dodge() {
      angle += (Math.PI / 2) + (Math.random() * Math.PI);
    }

    ['mouseenter', 'mousemove', 'mouseover', 'touchstart', 'pointerdown', 'click'].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dodge();
      });
    });

    /* 3. SWITCH TO PAGE 2 & CONFETTI */
    function goToPage2() {
      cancelAnimationFrame(animationFrameId);
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });
    }

    /* 4. LIGHTBOX MODAL FUNCTIONS */
    function openLightbox(imgSrc) {
      const modal = document.getElementById('lightboxModal');
      const modalImg = document.getElementById('lightboxImg');
      modalImg.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').style.display = 'none';
    }
  </script>
</body>
</html>
